server:
  port: 8890
  mode: debug

database:
  dsn: "postgres://postgres:postgres@127.0.0.1:5432/solana_scalper_v2?sslmode=disable"
  auto_migrate: true

datasource:
  kline_source: "gmgn" # gmgn / birdeye / sql / db；默认所有 K 线入口走 GMGN
  kline_query: ""
  token_search_query: ""

birdeye:
  base_url: "https://public-api.birdeye.so"
  api_key: "" # 对应环境变量 BACKTEST_BIRDEYE_API_KEY
  api_keys: [] # 对应环境变量 BACKTEST_BIRDEYE_API_KEYS，可传逗号分隔；429/额度耗尽时自动轮换
  chain: "solana"
  trade_max_pages: 1

gmgn:
  base_url: "https://openapi.gmgn.ai"
  api_key: "" # 对应环境变量 BACKTEST_GMGN_API_KEY；启动时写入数据库 Key 池
  api_keys: [] # 对应环境变量 BACKTEST_GMGN_API_KEYS，可传逗号分隔；所有 GMGN 请求轮询数据库 available Key
  chain: "sol"
  max_qps: 10 # 所有 GMGN 调用共享全局 10 QPS，Key 仍从数据库池轮询

bitquery:
  base_url: "https://streaming.bitquery.io/graphql"
  api_key: "" # 对应环境变量 BACKTEST_BITQUERY_API_KEY

xxyy:
  enabled: false
  base_url: "https://www.xxyy.io"
  api_key: "" # 对应环境变量 BACKTEST_XXYY_API_KEY；不要提交真实 Key
  poll_interval_seconds: 30 # XXYY 与 GMGN 每 30 秒交替执行，各来源约每分钟一次

telegram:
  enabled: false
  bot_token: "" # 对应环境变量 BACKTEST_TELEGRAM_BOT_TOKEN；不要提交真实 Token
  chat_id: "" # 对应环境变量 BACKTEST_TELEGRAM_CHAT_ID

alert:
  enabled: true # 依赖 Telegram 已启用；告警模块不参与也不阻断交易逻辑
  latency_threshold_ms: 3000
  consecutive_failures: 3
  consecutive_high_latency: 3
  recovery_successes: 2
  cooldown_seconds: 600
  resource_check_interval_seconds: 30
  resource_consecutive_samples: 3
  cpu_threshold_percent: 85
  memory_threshold_percent: 85

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  channel: "solana:meme:signals:pressure_breakout"
  consumer_channel: "" # 为空时交易消费沿用 channel

signal:
  candidate_monitor_enabled: false # 数据库尚无运行时配置时，作为“CA 获取与监控”的首次默认值
  candidate_channel: "solana_scalper:candidate_pool"
  poll_interval_seconds: 2
  interval: "1m"
  min_market_cap: 15000 # 入池后实时市值低于 15k 时移出候选池；只允许配置更高阈值
  lookback_bars: 120
  redis_key_prefix: "solana_meme_v2:signal_monitor"

trade:
  enabled: false
  signal_consumer: false # 数据库尚无运行时配置时，作为“接收信号并执行交易”的首次默认值
  price_sync_enabled: false
  price_sync_interval: 15
  account_name: "default"
  wallet_address: ""
  wallet_private_key: ""
  buy_amount_usd: 10 # 模拟盘和实盘共用的单次买入美元金额；执行时按当前 SOL/USD 价格换算输入 SOL
  slippage_bps: 200 # 实盘固定 2% 滑点保护；传入 /order 后会覆盖 RTSE
  priority_fee: 0
  solana_rpc_url: "https://api.mainnet-beta.solana.com"
  price_source: "gmgn" # gmgn / dexscreener；持仓估值默认使用 GMGN 最新 1m K 线 close
  dexscreener:
    base_url: "https://api.dexscreener.com"
  jupiter:
    base_url: "https://lite-api.jup.ag"
    api_key: ""
